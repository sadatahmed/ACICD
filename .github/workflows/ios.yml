name: iOS starter workflow

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode 16.2
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.2'

    - name: Initialize Simulators
      run: |
        sudo xcodebuild -runFirstLaunch
        xcrun simctl list devices

    - name: Resolve Dependencies
      run: |
        if [ -f Podfile ]; then
          pod install
        elif [ -f Package.swift ]; then
          swift package resolve
        fi

    - name: Detect Xcode Project Structure
      id: detect
      run: |
        if ls *.xcworkspace >/dev/null 2>&1; then
          echo "WORKSPACE_FILE=$(ls *.xcworkspace | head -1)" >> $GITHUB_OUTPUT
          echo "BUILD_TYPE=-workspace" >> $GITHUB_OUTPUT
        else
          echo "WORKSPACE_FILE=$(ls *.xcodeproj | head -1)" >> $GITHUB_OUTPUT
          echo "BUILD_TYPE=-project" >> $GITHUB_OUTPUT
        fi

        SCHEME=$(xcodebuild -list -json | jq -r '.project.schemes[0]')
        echo "SCHEME=$SCHEME" >> $GITHUB_OUTPUT

    - name: Select Simulator
      id: simulator
      run: |
        DEVICE=$(xcrun simctl list devices available | \
          grep -E 'iPhone.*(15|14|SE)' | \
          grep -v 'unavailable' | \
          head -1 | \
          awk -F '[()]' '{print $1}' | \
          sed 's/^[ \t]*//;s/[ \t]*$//')

        echo "Selected device: $DEVICE"
        echo "DEVICE_NAME=$DEVICE" >> $GITHUB_OUTPUT

    - name: Build and Test
      run: |
        set -x
        xcodebuild clean test \
          ${{ steps.detect.outputs.BUILD_TYPE }} ${{ steps.detect.outputs.WORKSPACE_FILE }} \
          -scheme "${{ steps.detect.outputs.SCHEME }}" \
          -destination "platform=iOS Simulator,name=${{ steps.simulator.outputs.DEVICE_NAME }}" \
          -destination-timeout 300 \
          -quiet \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_REQUIRED=NO \
          ONLY_ACTIVE_ARCH=YES \
          -disableAutomaticPackageResolution \
          -skipPackageUpdates

    - name: Upload Test Results
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: xcode-test-results
        path: |
          **/test_outputs/*.xcresult
          **/TestResults/*.xml
